name: OWL Desktop CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck and renderer build
        run: npm run build

      - name: Agent Inbox MCP contract
        run: npm run verify:agent-inbox-e2e

name: OWL LAB Desktop CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Electron main/preload syntax
        run: |
          node --check electron/main.mjs
          node --check electron/preload.cjs
          node --check electron/services/cloud-enrollment-service.mjs
          node --check electron/services/cloud-bridge-service.mjs
          node --check electron/services/cloud-bridge-store.mjs

      - name: Typecheck and renderer build
        run: npm run build

      - name: Agent Inbox MCP contract
        run: npm run verify:agent-inbox-e2e

      - name: Runtime AgentRequest consumer contract
        run: npm run verify:runtime-agent-request-consumer

  runtime-1x-skill-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Desktop
        uses: actions/checkout@v4

      - name: Checkout existing Runtime 1.x Skill branch
        uses: actions/checkout@v4
        with:
          repository: tubban1/owl-runtime
          ref: 9e36d0dc4ce6b10e792abea8cf8263de2baa4b20
          path: owl-runtime

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Desktop dependencies
        run: npm ci

      - name: Install Runtime dependencies
        working-directory: owl-runtime
        run: npm ci

      - name: Start Runtime 1.x public HTTP API
        shell: bash
        run: |
          set -euo pipefail
          (
            cd owl-runtime
            export PORT=8788
            export AGENTOS_STATE_ROOT="$RUNNER_TEMP/owl-runtime-skill-state"
            export ALLOWED_DIRECTORIES="$GITHUB_WORKSPACE/owl-runtime"
            npm run start:source
          ) > "$RUNNER_TEMP/owl-runtime.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/owl-runtime.pid"

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8788/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/owl-runtime.log"
          exit 1

      - name: Desktop → Runtime Skill discovery live E2E
        env:
          OWL_RUNTIME_URL: http://127.0.0.1:8788
          OWL_RUNTIME_FIXTURE_REPO: ${{ github.workspace }}/owl-runtime
        run: npm run verify:skill-discovery-live

      - name: Runtime log
        if: always()
        run: cat "$RUNNER_TEMP/owl-runtime.log" || true

      - name: Stop Runtime
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/owl-runtime.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/owl-runtime.pid")" 2>/dev/null || true
          fi


  runtime-agent-request-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Desktop
        uses: actions/checkout@v4

      - name: Checkout Runtime public event producer
        uses: actions/checkout@v4
        with:
          repository: tubban1/owl-runtime
          ref: a44c5d26636c71faf8a8c146ef43e2af71332b11
          path: owl-runtime

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Desktop dependencies
        run: npm ci

      - name: Install Runtime dependencies
        working-directory: owl-runtime
        run: npm ci

      - name: Start Runtime public event API
        shell: bash
        run: |
          set -euo pipefail
          (
            cd owl-runtime
            export PORT=8788
            export AGENTOS_STATE_ROOT="$RUNNER_TEMP/owl-runtime-agent-event-state"
            export ALLOWED_DIRECTORIES="$GITHUB_WORKSPACE/owl-runtime"
            export RUNTIME_PUBLIC_EVENT_RETENTION_MAX=2
            npm run start:source
          ) > "$RUNNER_TEMP/owl-runtime-agent-events.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/owl-runtime-agent-events.pid"

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8788/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/owl-runtime-agent-events.log"
          exit 1

      - name: Desktop → Runtime AgentRequest durable event E2E
        env:
          OWL_RUNTIME_URL: http://127.0.0.1:8788
          OWL_RUNTIME_FIXTURE_REPO: ${{ github.workspace }}/owl-runtime
        run: npm run verify:runtime-agent-request-live

      - name: Runtime event log
        if: always()
        run: cat "$RUNNER_TEMP/owl-runtime-agent-events.log" || true

      - name: Stop Runtime
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/owl-runtime-agent-events.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/owl-runtime-agent-events.pid")" 2>/dev/null || true
          fi

  runtime-request-replay-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Desktop
        uses: actions/checkout@v4

      - name: Checkout Runtime R1 consequential replay provider
        uses: actions/checkout@v4
        with:
          repository: tubban1/owl-runtime
          ref: f00ba4f7f5c3fbddc18cf7c04fc0cfccdbb786bd
          path: owl-runtime

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Desktop dependencies
        run: npm ci

      - name: Install Runtime dependencies
        working-directory: owl-runtime
        run: npm ci

      - name: Start Runtime R1 public HTTP API
        shell: bash
        run: |
          set -euo pipefail
          (
            cd owl-runtime
            export PORT=8788
            export AGENTOS_STATE_ROOT="$RUNNER_TEMP/owl-runtime-request-replay-state"
            export ALLOWED_DIRECTORIES="$GITHUB_WORKSPACE/owl-runtime"
            npm run start:source
          ) > "$RUNNER_TEMP/owl-runtime-request-replay.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/owl-runtime-request-replay.pid"

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8788/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/owl-runtime-request-replay.log"
          exit 1

      - name: Desktop → Runtime consequential replay live E2E
        env:
          OWL_RUNTIME_URL: http://127.0.0.1:8788
          OWL_RUNTIME_FIXTURE_REPO: ${{ github.workspace }}/owl-runtime
        run: npm run verify:runtime-replay-live

      - name: Runtime replay log
        if: always()
        run: cat "$RUNNER_TEMP/owl-runtime-request-replay.log" || true

      - name: Stop Runtime
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/owl-runtime-request-replay.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/owl-runtime-request-replay.pid")" 2>/dev/null || true
          fi


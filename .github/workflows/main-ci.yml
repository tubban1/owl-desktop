name: OWL Desktop Main CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/verify-mcp-catalog.mjs
      - run: node --test workers/owl-mailer/test/worker.test.mjs tests/ota-coordinator.test.mjs
      - run: npm run build
      - run: node --check electron/main.mjs

<!doctype html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OWL Chrome Companion</title><style>
body{font:13px/1.55 system-ui,sans-serif;background:#121d25;color:#ebf3f5;width:360px;box-sizing:border-box;margin:0;padding:16px}
h1{font-size:18px;margin:0 0 3px}h2{font-size:12px;color:#b8c7ce;margin:16px 0 6px}
p,small{color:#b8c7ce;margin:5px 0 10px}button{background:#236d58;color:#fff;border:0;border-radius:8px;padding:9px 12px;cursor:pointer}
button.secondary{background:#30424c}button.danger{background:#805348}button:disabled{opacity:.5;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}input{color:#fff;background:#253942;border:1px solid #61737c;border-radius:7px;padding:9px;width:100%;box-sizing:border-box}
#status{background:#20323b;padding:10px;border-radius:7px;overflow-wrap:anywhere}
#approval{border:1px solid #c7974a;background:#483c2e;border-radius:7px;padding:10px;margin-top:12px}
pre{white-space:pre-wrap;max-height:160px;overflow:auto;background:#20323b;padding:8px;font-size:11px}
</style></head><body>
<h1>OWL LAB · Chrome Companion</h1>
<p>只连接你主动授权的标签页。其他标签页不受影响。</p>
<h2>1. 输入 OWL Agent 提供的一次性配对码</h2>
<input id="code" placeholder="16 位配对码" spellcheck="false" autocomplete="off" maxlength="19">
<div class="actions"><button id="pair">连接 OWL LAB</button><button class="secondary" id="disconnect">断开配对</button></div>
<h2>2. 授权当前标签页</h2>
<div class="actions"><button id="attach">授权此标签页（2 分钟）</button><button id="edit" class="secondary">允许填写表单</button><button id="detach" class="secondary">撤销网站授权</button></div>
<div class="actions"><button id="startCapture" class="secondary">开启此标签页后台截图</button><button id="stopCapture" class="secondary">停止截图</button></div><div id="approval" hidden><strong>Agent 请求点击</strong><p id="request"></p><div class="actions"><button id="approve">我确认，执行点击</button><button id="reject" class="danger">拒绝</button></div></div>
<h2>连接状态</h2><div id="status" role="status" aria-live="polite">正在检查…</div>
<div class="actions"><button id="inspect" class="secondary">预览当前授权页面</button></div><pre id="preview" hidden></pre>
<small>密码字段、删除及付款操作受到保护。任何保存点击都需再次确认。关闭或跨网站导航会撤销授权。</small>
<script type="module" src="popup.mjs"></script></body></html>

appId: ai.owl.desktop
productName: OWL LAB Desktop
asar: true
compression: maximum
artifactName: 'OWL-LAB-Desktop-${version}-${arch}.${ext}'
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - mcp/**/*
  - connection-host/**/*
  - chrome-agent-native/**/*
  - scripts/install-chrome-native-host.mjs
  - shared/**/*
  - package.json
extraResources:
  - from: chrome-agent-native
    to: chrome-agent-native
  - from: connection-host/native-messaging-host.mjs
    to: native-messaging/native-messaging-host.mjs
  - from: scripts/install-chrome-native-host.mjs
    to: native-messaging/install-chrome-native-host.mjs
  - from: vendor/owl-runtime
    to: owl-runtime
  - from: vendor/owl-tunnel
    to: owl-tunnel
  - from: vendor/runtime-node
    to: runtime-node
  - from: vendor/runtime-host
    to: runtime-host
  - from: vendor/helper
    to: helper
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

appId: ai.owl.desktop
productName: OWL LAB Desktop
asar: true
compression: maximum
artifactName: 'OWL-LAB-Desktop-${version}-${arch}.${ext}'
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - mcp/**/*
  - package.json
extraResources:
  - from: vendor/owl-runtime
    to: owl-runtime
  - from: vendor/owl-tunnel
    to: owl-tunnel
  - from: vendor/runtime-host
    to: runtime-host
  - from: vendor/helper
    to: helper
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
